<header class="admin-topbar">
  <button type="button" class="admin-menu-toggle" id="adminMenuToggle" aria-label="Toggle navigation" aria-expanded="false">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <div class="admin-topbar-actions">
    {% include 'includes/notification_center.html' %}
    <span class="admin-date" id="adminCurrentDate"></span>
    <div class="admin-profile">
      <span class="admin-avatar">{{ user.first_name|first|default:user.username|first|upper }}</span>
      <span><strong>{{ user.get_full_name|default:user.username }}</strong><small>Administrator</small></span>
    </div>
  </div>
</header>
