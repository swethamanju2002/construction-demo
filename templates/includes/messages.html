{% if messages %}
<div class="container crm-toast-stack" style="margin-top: 1.5rem;">
  {% for message in messages %}
  <div class="alert {% if message.tags == 'error' %}alert-error{% elif message.tags == 'success' %}alert-success{% else %}alert-info{% endif %}">
    <span>
      {% if message.tags == 'success' %}✓{% elif message.tags == 'error' %}⚠{% else %}ℹ{% endif %}
    </span>
    <div>{{ message }}</div>
  </div>
  {% endfor %}
</div>
{% endif %}
